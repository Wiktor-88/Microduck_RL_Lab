[project]
name = "ducklab"
version = "0.1.0"
description = "Deep Reinforcement Learning framework for Microduck locomotion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ducklab"]
